# RESERVE server (57.131.195.188, subnets 10.9.<REGION>.0/24).
# Same image/ports/volumes as docker-compose.yml + the failback watchdog.
#
# echo HOST_ADDR=57.131.195.188 > .env && docker compose -f docker-compose.reserve.yaml up -d
#
# The failback watchdog needs `management 0.0.0.0 7505` in each reserve
# server.conf (see README.fork.md). The port is NOT published to the host.

version: '3.3'

services:
  vpn-26:
    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
    cap_add:
      - NET_ADMIN
    ports:
      - "2226:22"
      - "1195:1194/udp"
    environment:
      HOST_ADDR: ${HOST_ADDR}
    volumes:
      - openvpn-26:/opt/Dockovpn_data
    restart: always

  vpn-73:
    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
    cap_add:
      - NET_ADMIN
    ports:
      - "2273:22"
      - "1196:1194/udp"
    environment:
      HOST_ADDR: ${HOST_ADDR}
    volumes:
      - openvpn-73:/opt/Dockovpn_data
    restart: always

  vpn-68:
    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
    cap_add:
      - NET_ADMIN
    ports:
      - "2268:22"
      - "1197:1194/udp"
    environment:
      HOST_ADDR: ${HOST_ADDR}
    volumes:
      - openvpn-68:/opt/Dockovpn_data
    restart: always

#  vpn-44:
#    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
#    cap_add:
#      - NET_ADMIN
#    ports:
#      - "2244:22"
#      - "1198:1194/udp"
#    environment:
#      HOST_ADDR: ${HOST_ADDR}
#    volumes:
#      - openvpn-44:/opt/Dockovpn_data
#    restart: always

  vpn-56:
    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
    cap_add:
      - NET_ADMIN
    ports:
      - "2256:22"
      - "1199:1194/udp"
    environment:
      HOST_ADDR: ${HOST_ADDR}
    volumes:
      - openvpn-56:/opt/Dockovpn_data
    restart: always

  vpn-61:
    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
    cap_add:
      - NET_ADMIN
    ports:
      - "2261:22"
      - "1193:1194/udp"
    environment:
      HOST_ADDR: ${HOST_ADDR}
    volumes:
      - openvpn-61:/opt/Dockovpn_data
    restart: always

  # Kicks clients back to the primary once it is reachable again.
  # Script is bind-mounted, so the image does not need a rebuild.
  failback:
    image: cloud.canister.io:5000/skr/skr-openvpn-server:tunnel
    entrypoint: ["/bin/bash", "/failback.sh"]
    environment:
      FAILBACK_ENABLED: "1"          # 0 = disable
      FAILBACK_STABLE_MIN: "5"       # minutes the primary must be up
      FAILBACK_REGIONS: "26 73 68 44 56 61"
      PRIMARY_ADDR: "185.69.153.81"
    volumes:
      - ./scripts/failback.sh:/failback.sh:ro
    restart: always

volumes:
  openvpn-26:
    external: true
  openvpn-73:
    external: true
  openvpn-68:
    external: true
  openvpn-44:
    external: true
  openvpn-56:
    external: true
  openvpn-61:
    external: true
